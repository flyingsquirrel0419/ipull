name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: AppStoreCore unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run core package tests
        run: swift test --package-path Packages/AppStoreCore

  app-build:
    name: Build app + share extension (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build iPull (unsigned, for simulator)
        run: |
          xcodebuild build \
            -project iPull.xcodeproj \
            -scheme iPull \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

  app-archive:
    name: Archive unsigned IPA artifact
    runs-on: macos-15
    needs: app-build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build for device (unsigned)
        run: |
          xcodebuild build \
            -project iPull.xcodeproj \
            -scheme iPull \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload out
          cp -R "build/Build/Products/Release-iphoneos/iPull.app" Payload/
          zip -r out/iPull-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iPull-unsigned-ipa
          path: out/iPull-unsigned.ipa
