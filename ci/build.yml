name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: AppStoreCore unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run core package tests
        run: swift test --package-path Packages/AppStoreCore

  app-build:
    name: Build app + share extension (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: CI_BUILD_NUMBER=${{ github.run_number }} xcodegen

      - name: Build iPull (unsigned, for simulator)
        run: |
          xcodebuild build \
            -project iPull.xcodeproj \
            -scheme iPull \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

  app-archive:
    name: Archive unsigned IPA artifact
    runs-on: macos-15
    needs: [core-tests, app-build]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: CI_BUILD_NUMBER=${{ github.run_number }} xcodegen

      - name: Build for device (unsigned)
        run: |
          xcodebuild build \
            -project iPull.xcodeproj \
            -scheme iPull \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -derivedDataPath build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload out
          cp -R "build/Build/Products/Release-iphoneos/iPull.app" Payload/
          zip -r out/iPull-unsigned.ipa Payload
          shasum -a 256 out/iPull-unsigned.ipa > out/iPull-unsigned.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iPull-unsigned-ipa
          path: out/

  prerelease:
    name: Create prerelease
    runs-on: ubuntu-latest
    needs: app-archive
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: iPull-unsigned-ipa
          path: out

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            out/iPull-unsigned.ipa
            out/iPull-unsigned.ipa.sha256
          body: |
            **Unsigned build.** Install with your preferred sideloading tool
            (AltStore, SideStore, Sideloadly, ...) - the sideloading tool
            re-signs the app with your own certificate.

            Verify integrity: shasum -a 256 iPull-unsigned.ipa and compare
            with the attached .sha256 file.

            See VERIFICATION.md for what is tested and
            docs/device-verification-checklist.md for on-device checks.
