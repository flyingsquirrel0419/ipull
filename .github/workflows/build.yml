name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  unicorn-ios:
    name: Build libunicorn for iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build static libunicorn (arm64 device + simulator)
        run: bash ci/unicorn-ios.sh
      - name: Upload unicorn artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unicorn-ios
          path: |
            build/unicorn/iphoneos/
            build/unicorn/iphonesimulator/
            build/unicorn/macos/
  simulator-tests:
    name: Core tests on iOS Simulator (arm64)
    runs-on: macos-15
    needs: unicorn-ios
    steps:
      - uses: actions/checkout@v4
      - name: Download unicorn artifact
        uses: actions/download-artifact@v4
        with:
          name: unicorn-ios
          path: build/unicorn
      - name: Vendor unicorn (simulator)
        run: |
          mkdir -p Packages/AppStoreCore/Vendor/unicorn/lib
          cp build/unicorn/iphonesimulator/lib/libunicorn.a Packages/AppStoreCore/Vendor/unicorn/lib/
      - name: Run package tests on macOS (host arch matches simulator target)
        run: swift test --package-path Packages/AppStoreCore
      - name: Build package for iOS Simulator (arm64)
        run: |
          xcodebuild build \
            -scheme AppStoreCore \
            -destination 'generic/platform=iOS Simulator' \
            -package-path Packages/AppStoreCore \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64
  core-tests:
    name: AppStoreCore unit tests
    runs-on: macos-15
    needs: unicorn-ios
    steps:
      - uses: actions/checkout@v4
      - name: Download unicorn artifact
        uses: actions/download-artifact@v4
        with:
          name: unicorn-ios
          path: build/unicorn
      - name: Vendor unicorn for the package
        run: |
          mkdir -p Packages/AppStoreCore/Vendor/unicorn/lib Packages/AppStoreCore/Vendor/unicorn/include
          cp build/unicorn/macos/lib/libunicorn.a Packages/AppStoreCore/Vendor/unicorn/lib/
      - name: Run core package tests
        run: swift test --package-path Packages/AppStoreCore

  app-build:
    name: Build app + share extension (simulator)
    runs-on: macos-15
    needs: unicorn-ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download unicorn artifact
        uses: actions/download-artifact@v4
        with:
          name: unicorn-ios
          path: build/unicorn

      - name: Vendor unicorn for the package
        run: |
          mkdir -p Packages/AppStoreCore/Vendor/unicorn/lib Packages/AppStoreCore/Vendor/unicorn/include
          cp build/unicorn/iphonesimulator/lib/libunicorn.a Packages/AppStoreCore/Vendor/unicorn/lib/

      - name: Generate Xcode project
        run: CI_BUILD_NUMBER=${{ github.run_number }} xcodegen

      - name: Build iPull (unsigned, for simulator)
        run: |
          xcodebuild build \
            -project iPull.xcodeproj \
            -scheme iPull \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

  app-archive:
    name: Archive unsigned IPA artifact
    runs-on: macos-15
    needs: [core-tests, app-build, unicorn-ios]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download unicorn artifact
        uses: actions/download-artifact@v4
        with:
          name: unicorn-ios
          path: build/unicorn

      - name: Vendor unicorn for the package (device)
        run: |
          mkdir -p Packages/AppStoreCore/Vendor/unicorn/lib
          cp build/unicorn/iphoneos/lib/libunicorn.a Packages/AppStoreCore/Vendor/unicorn/lib/

      - name: Generate Xcode project
        run: CI_BUILD_NUMBER=${{ github.run_number }} xcodegen

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" iPull/Resources/Info.plist)
          echo "tag=$TAG_VERSION plist=$PLIST_VERSION"
          if [ "$TAG_VERSION" != "$PLIST_VERSION" ]; then
            echo "::error::Info.plist version $PLIST_VERSION does not match tag $TAG_VERSION"
            exit 1
          fi

      - name: Build for device (unsigned)
        run: |
          xcodebuild build \
            -project iPull.xcodeproj \
            -scheme iPull \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -derivedDataPath build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload out
          cp -R "build/Build/Products/Release-iphoneos/iPull.app" Payload/
          zip -r out/iPull-unsigned.ipa Payload
          shasum -a 256 out/iPull-unsigned.ipa > out/iPull-unsigned.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iPull-unsigned-ipa
          path: out/

  prerelease:
    name: Create prerelease
    runs-on: ubuntu-latest
    needs: app-archive
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: iPull-unsigned-ipa
          path: out

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            out/iPull-unsigned.ipa
            out/iPull-unsigned.ipa.sha256
          body: |
            **Unsigned build.** Install with your preferred sideloading tool
            (AltStore, SideStore, Sideloadly, ...) - the sideloading tool
            re-signs the app with your own certificate.

            Verify integrity: shasum -a 256 iPull-unsigned.ipa and compare
            with the attached .sha256 file.

            See VERIFICATION.md for what is tested and
            docs/device-verification-checklist.md for on-device checks.
