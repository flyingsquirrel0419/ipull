name: iPull
options:
  bundleIdPrefix: com.ipull
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"

packages:
  AppStoreCore:
    path: Packages/AppStoreCore

targets:
  iPull:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iPull
        excludes:
          - "**/*.md"
    info:
      path: iPull/Resources/Info.plist
      properties:
        CFBundleDisplayName: iPull
        CFBundleShortVersionString: "0.3.40"
        CFBundleURLTypes:
          - CFBundleURLSchemes: [ipull]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    entitlements:
      path: iPull/iPull.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ipull.app]
    dependencies:
      - package: AppStoreCore
        product: AppStoreCore
      - target: iPullShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ipull.app
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CURRENT_PROJECT_VERSION: "${CI_BUILD_NUMBER:-1}"

  iPullShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iPullShareExtension
        excludes:
          - "**/*.md"
    info:
      path: iPullShareExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
    entitlements:
      path: iPullShareExtension/iPullShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ipull.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ipull.app.share
        SWIFT_VERSION: "6.0"

  iPullTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iPullTests
    dependencies:
      - target: iPull
      - package: AppStoreCore
        product: AppStoreCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ipull.app.tests
        SWIFT_VERSION: "6.0"
